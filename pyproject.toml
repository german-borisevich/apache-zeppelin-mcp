[project]
name = "apache-zeppelin-mcp"
version = "0.1.0"
description = "MCP server for Apache Zeppelin notebook interaction via the REST API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.28.1",
    "mcp[cli]>=1.26.0",
]

[project.scripts]
apache-zeppelin-mcp = "server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["server"]
